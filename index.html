<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Optimasi Mobile: Mencegah zoom tidak sengaja -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kanaa Thumbnail Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            background-color: #f3e8ff; /* Soft purple background */
            background-image: radial-gradient(#e9d5ff 1px, transparent 1px);
            background-size: 20px 20px;
            /* Optimasi Mobile */
            overflow-x: hidden; 
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Custom Scrollbar for the control panel */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #c084fc; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a855f7; 
        }

        /* Custom styling for range inputs */
        input[type=range] {
            accent-color: #9333ea;
        }

        /* Styling Kanvas agar bisa digeser tanpa men-scroll halaman */
        #preview-canvas {
            touch-action: none; /* Mencegah scroll saat menggeser stiker di HP */
            cursor: grab;
        }
        #preview-canvas:active {
            cursor: grabbing;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

    <!-- Header -->
    <header class="mb-8 text-center bg-white/80 backdrop-blur-md px-10 py-4 rounded-3xl shadow-xl border border-purple-200">
        <h1 class="text-3xl md:text-4xl font-bold text-purple-700 mb-2">✨ Thumbnail Generator ✨</h1>
        <p class="text-purple-500 font-medium">Buat thumbnail 16:9 & 1:1 otomatis untuk KanaaLikeSleeping</p>
    </header>

    <!-- Main Content -->
    <main class="w-full max-w-7xl flex flex-col lg:flex-row gap-8">
        
        <!-- Control Panel (Left Side) -->
        <div class="w-full lg:w-1/3 bg-white/90 backdrop-blur-sm p-6 rounded-3xl shadow-2xl border border-pink-100 flex flex-col gap-6 h-fit lg:sticky lg:top-8">
            
            <!-- Ratio Selector -->
            <div>
                <label class="block text-sm font-bold text-purple-700 mb-2">Pilih Rasio Thumbnail</label>
                <div class="flex gap-4">
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="ratio" value="16:9" class="peer sr-only" checked onchange="handleRatioChange()">
                        <div class="text-center py-3 rounded-xl border-2 border-purple-200 text-purple-500 font-semibold peer-checked:bg-purple-600 peer-checked:text-white peer-checked:border-purple-600 transition-all shadow-sm">
                            16:9 (YouTube)
                        </div>
                    </label>
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="ratio" value="1:1" class="peer sr-only" onchange="handleRatioChange()">
                        <div class="text-center py-3 rounded-xl border-2 border-purple-200 text-purple-500 font-semibold peer-checked:bg-purple-600 peer-checked:text-white peer-checked:border-purple-600 transition-all shadow-sm">
                            1:1 (Website)
                        </div>
                    </label>
                </div>
            </div>

            <!-- Upload Photo -->
            <div>
                <label class="block text-sm font-bold text-purple-700 mb-2">Upload Foto Konten</label>
                <div class="relative flex items-center justify-center w-full">
                    <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-purple-300 border-dashed rounded-xl cursor-pointer bg-purple-50 hover:bg-purple-100 transition-colors">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6">
                            <svg class="w-8 h-8 mb-3 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                            <p class="mb-2 text-sm text-purple-600 font-semibold"><span class="font-bold">Klik untuk upload</span></p>
                            <p class="text-xs text-purple-500 text-center px-4">PNG, JPG (Foto ini akan masuk ke belakang teks)</p>
                        </div>
                        <input type="file" id="image-upload" class="hidden" accept="image/*" onchange="handleImageUpload(event)" />
                    </label>
                </div>
            </div>

            <!-- Title Settings -->
            <div class="space-y-4 bg-purple-50 p-4 rounded-xl border border-purple-100">
                <div>
                    <label class="block text-sm font-bold text-purple-700 mb-1">Judul Thumbnail</label>
                    <textarea id="title-text" rows="2" class="w-full px-4 py-2 rounded-lg border-2 border-purple-200 focus:border-purple-500 focus:ring-0 outline-none resize-none font-semibold text-gray-700" placeholder="Ketik judul konten di sini..." oninput="drawCanvas()">S3PA PV D1 K45...</textarea>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div class="col-span-2">
                        <label class="block text-xs font-bold text-purple-700 mb-1">Ukuran Teks</label>
                        <input type="range" id="text-size" min="30" max="150" value="80" class="w-full" oninput="drawCanvas()">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-purple-700 mb-1">Posisi Teks (X)</label>
                        <input type="range" id="text-x" min="0" max="1500" value="80" class="w-full" oninput="drawCanvas()">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-purple-700 mb-1">Posisi Teks (Y)</label>
                        <input type="range" id="text-y" min="0" max="1000" value="80" class="w-full" oninput="drawCanvas()">
                    </div>
                </div>
            </div>

            <!-- Image Position Settings -->
            <div class="space-y-4 bg-pink-50 p-4 rounded-xl border border-pink-100">
                <label class="block text-sm font-bold text-pink-700">Sesuaikan Posisi Foto</label>
                <div>
                    <label class="block text-xs font-bold text-pink-700 mb-1">Ukuran (Scale)</label>
                    <input type="range" id="img-scale" min="10" max="200" value="100" class="w-full" oninput="drawCanvas()">
                </div>
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="block text-xs font-bold text-pink-700 mb-1">Geser Kiri/Kanan</label>
                        <input type="range" id="img-x" min="0" max="1500" value="100" class="w-full" oninput="drawCanvas()">
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs font-bold text-pink-700 mb-1">Geser Atas/Bawah</label>
                        <input type="range" id="img-y" min="0" max="1000" value="250" class="w-full" oninput="drawCanvas()">
                    </div>
                </div>
            </div>

            <!-- Sticker Panel (NEW FEATURE) -->
            <div class="space-y-4 bg-amber-50 p-4 rounded-xl border border-amber-100">
                <label class="block text-sm font-bold text-amber-700 mb-2">🎈 Tambah Sticker (Geser dengan Jari)</label>
                <div class="flex flex-wrap gap-3 mb-3">
                    <!-- Preset Emoji Stickers -->
                    <button onclick="addPresetSticker('⭐')" class="text-2xl hover:scale-125 transition-transform">⭐</button>
                    <button onclick="addPresetSticker('🔥')" class="text-2xl hover:scale-125 transition-transform">🔥</button>
                    <button onclick="addPresetSticker('✨')" class="text-2xl hover:scale-125 transition-transform">✨</button>
                    <button onclick="addPresetSticker('💯')" class="text-2xl hover:scale-125 transition-transform">💯</button>
                    <button onclick="addPresetSticker('😂')" class="text-2xl hover:scale-125 transition-transform">😂</button>
                    <button onclick="addPresetSticker('😱')" class="text-2xl hover:scale-125 transition-transform">😱</button>
                </div>
                <div>
                    <label class="block text-xs font-bold text-amber-700 mb-2">Atau Upload PNG Sticker:</label>
                    <input type="file" id="sticker-upload" class="text-xs file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-amber-100 file:text-amber-700 hover:file:bg-amber-200 cursor-pointer" accept="image/png, image/jpeg" onchange="handleStickerUpload(event)">
                </div>

                <!-- Kontrol Stiker Terpilih (MUNCUL SAAT DIKLIK) -->
                <div id="selected-sticker-controls" class="hidden mt-3 p-3 bg-white/60 rounded-xl border border-amber-200">
                    <label class="block text-xs font-bold text-amber-800 mb-1">Sticker Terpilih: Atur Ukuran</label>
                    <input type="range" id="sticker-scale-slider" min="0.2" max="4" step="0.1" value="1" class="w-full mb-3" oninput="updateStickerScale()">
                    <button onclick="deleteSelectedSticker()" class="w-full py-2 bg-red-500 text-white font-bold rounded-lg text-sm hover:bg-red-600 transition-colors shadow-sm">
                        Hapus Sticker Ini
                    </button>
                </div>

                <button onclick="clearStickers()" class="w-full mt-2 py-2 bg-red-100 text-red-600 font-bold rounded-lg text-sm hover:bg-red-200 transition-colors">
                    Hapus Semua Sticker
                </button>
            </div>

            <!-- Download Button -->
            <button onclick="downloadThumbnail()" class="w-full py-4 mt-2 bg-gradient-to-r from-purple-600 to-pink-500 hover:from-purple-700 hover:to-pink-600 text-white font-bold rounded-xl shadow-lg transform hover:scale-[1.02] transition-all flex items-center justify-center gap-2 text-lg">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Download Thumbnail
            </button>
        </div>

        <!-- Preview Area (Right Side) -->
        <div class="w-full lg:w-2/3 flex flex-col items-center">
            <div class="w-full bg-white/90 p-4 md:p-6 rounded-3xl shadow-2xl border border-purple-200 overflow-hidden">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-purple-800">Preview (Hasil Akhir)</h2>
                    <span id="resolution-badge" class="px-3 py-1 bg-purple-100 text-purple-700 rounded-full text-sm font-bold border border-purple-200">1280 x 720</span>
                </div>
            
                <!-- Canvas Container - Responsive wrapper -->
                <div class="relative w-full rounded-xl overflow-hidden bg-gray-100 flex justify-center items-center select-none" style="aspect-ratio: 16/9;" id="canvas-container">
                    <!-- The actual canvas rendering at full resolution but scaled down via CSS -->
                    <canvas id="preview-canvas" class="w-full h-full object-contain shadow-md"></canvas>
                </div>
            
                <p class="mt-4 text-sm text-gray-500 text-center">
                    <span class="font-bold text-amber-600">Info:</span> Background otomatis dari GitHub. <br/> 
                    <span class="text-purple-600 font-medium">Sticker bisa ditekan lalu digeser posisinya di atas gambar.</span>
                </p>
            </div>
        </div>

    </main>

    <script>
        const canvas = document.getElementById('preview-canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        
        // Element References
        const titleInput = document.getElementById('title-text');
        const textSizeInput = document.getElementById('text-size');
        const textXInput = document.getElementById('text-x');
        const textYInput = document.getElementById('text-y');
        
        const imgScaleInput = document.getElementById('img-scale');
        const imgXInput = document.getElementById('img-x');
        const imgYInput = document.getElementById('img-y');
        const resolutionBadge = document.getElementById('resolution-badge');
        const stickerUploadInput = document.getElementById('sticker-upload');
        const selectedStickerControls = document.getElementById('selected-sticker-controls');
        const stickerScaleSlider = document.getElementById('sticker-scale-slider');

        // State
        let currentRatio = '16:9';
        let uploadedPhoto = null;
        
        // State for Stickers
        let stickers = [];
        let draggingSticker = null;
        let selectedSticker = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        // Base Backgrounds
        const bg16x9 = new Image();
        bg16x9.crossOrigin = 'anonymous'; 
        bg16x9.src = 'https://raw.githubusercontent.com/takamura-wq/aura-thumbnail/main/images/landscape.jpeg';
        bg16x9.onerror = function() {
            bg16x9.src = 'https://placehold.co/1280x720/e9d5ff/7e22ce?text=Background+16:9+Tidak+Ditemukan.';
        };
        bg16x9.onload = drawCanvas;

        const bg1x1 = new Image();
        bg1x1.crossOrigin = 'anonymous'; 
        bg1x1.src = 'https://raw.githubusercontent.com/takamura-wq/aura-thumbnail/main/images/potrait.jpeg';
        bg1x1.onerror = function() {
            bg1x1.src = 'https://placehold.co/1080x1080/e9d5ff/7e22ce?text=Background+1:1+Tidak+Ditemukan.';
        };
        bg1x1.onload = drawCanvas;

        // Default Presets based on aspect ratio
        const presets = {
            '16:9': {
                width: 1280, height: 720,
                textX: 430, textY: 80, textSize: 55, imgX: 180, imgY: 220, imgScale: 100,
                textMaxWidth: 700 
            },
            '1:1': {
                width: 1080, height: 1080,
                textX: 335, textY: 100, textSize: 65, imgX: 140, imgY: 280, imgScale: 100,
                textMaxWidth: 550
            }
        };

        function autoFitImage() {
            if (!uploadedPhoto) return;
            const preset = presets[currentRatio];
            const maxW = preset.width * 0.75;
            const maxH = preset.height * 0.55;
            
            imgXInput.value = preset.imgX;
            const estimatedTextHeight = parseInt(textSizeInput.value) * 2.5; 
            imgYInput.value = parseInt(textYInput.value) + estimatedTextHeight;
            imgScaleInput.value = 100;
        }

        function handleRatioChange() {
            const radios = document.getElementsByName('ratio');
            for (const radio of radios) {
                if (radio.checked) {
                    currentRatio = radio.value;
                    break;
                }
            }

            container.style.aspectRatio = currentRatio === '16:9' ? '16/9' : '1/1';
            const preset = presets[currentRatio];
            
            textXInput.value = preset.textX;
            textYInput.value = preset.textY;
            textSizeInput.value = preset.textSize;
            imgXInput.value = preset.imgX;
            imgYInput.value = preset.imgY;
            imgScaleInput.value = preset.imgScale;
            resolutionBadge.innerText = `${preset.width} x ${preset.height}`;

            textXInput.max = preset.width;
            textYInput.max = preset.height;
            imgXInput.max = preset.width;
            imgYInput.max = preset.height;

            if (uploadedPhoto) {
                autoFitImage(); 
            }

            drawCanvas();
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedPhoto = new Image();
                uploadedPhoto.onload = function() {
                    autoFitImage();
                    drawCanvas();
                };
                uploadedPhoto.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // --- STICKER FUNCTIONS ---

        function addPresetSticker(emoji) {
            const newSticker = {
                type: 'text',
                content: emoji,
                x: canvas.width / 2 - 50,
                y: canvas.height / 2 - 50,
                width: 110, 
                height: 110,
                fontSize: 100,
                scale: 1 // Default scale
            };
            stickers.push(newSticker);
            setSelectedSticker(newSticker);
            drawCanvas();
        }

        function handleStickerUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    let w = img.width;
                    let h = img.height;
                    const maxDim = 250; // Batasi ukuran maksimal stiker
                    if (w > maxDim || h > maxDim) {
                        const ratio = Math.min(maxDim / w, maxDim / h);
                        w *= ratio;
                        h *= ratio;
                    }
                    const newSticker = {
                        type: 'image',
                        img: img,
                        x: canvas.width / 2 - w/2,
                        y: canvas.height / 2 - h/2,
                        width: w,
                        height: h,
                        scale: 1 // Default scale
                    };
                    stickers.push(newSticker);
                    setSelectedSticker(newSticker);
                    drawCanvas();
                    stickerUploadInput.value = ''; // Reset input agar bisa upload yang sama lagi
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function clearStickers() {
            stickers = [];
            draggingSticker = null;
            setSelectedSticker(null);
            drawCanvas();
        }

        function setSelectedSticker(sticker) {
            selectedSticker = sticker;
            if (sticker) {
                selectedStickerControls.classList.remove('hidden');
                stickerScaleSlider.value = sticker.scale;
            } else {
                selectedStickerControls.classList.add('hidden');
            }
        }

        function updateStickerScale() {
            if (selectedSticker) {
                selectedSticker.scale = parseFloat(stickerScaleSlider.value);
                drawCanvas();
            }
        }

        function deleteSelectedSticker() {
            if (selectedSticker) {
                stickers = stickers.filter(s => s !== selectedSticker);
                setSelectedSticker(null);
                drawCanvas();
            }
        }

        // Menerjemahkan koordinat jari/mouse di layar menjadi koordinat di dalam Canvas (1280x720 / 1080x1080)
        function getCanvasCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            // Cek apakah event dari touch (jari) atau mouse
            const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches && e.touches.length > 0 ? e.touches[0].clientY : e.clientY;

            // Skala antara ukuran tampil di HP/layar dengan ukuran asli gambar
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function handlePointerDown(e) {
            const { x, y } = getCanvasCoordinates(e);

            // Cek stiker dari urutan paling atas (terakhir ditambahkan)
            let foundSticker = false;
            for (let i = stickers.length - 1; i >= 0; i--) {
                const s = stickers[i];
                const currentScale = s.scale || 1;
                const hitWidth = s.width * currentScale;
                const hitHeight = s.height * currentScale;
                
                // Hitbox sederhana kotak yang sudah mempertimbangkan Scale (perbesaran)
                if (x >= s.x && x <= s.x + hitWidth && y >= s.y && y <= s.y + hitHeight) {
                    draggingSticker = s;
                    setSelectedSticker(s);
                    dragOffsetX = x - s.x;
                    dragOffsetY = y - s.y;
                    
                    // Pindahkan stiker yang disentuh ke lapisan paling atas
                    stickers.splice(i, 1);
                    stickers.push(s);
                    
                    foundSticker = true;
                    e.preventDefault(); // Mencegah scrolling browser
                    drawCanvas();
                    break; // Berhenti mencari setelah nemu 1 stiker
                }
            }

            // Jika klik di area kosong (tidak kena stiker manapun), hilangkan seleksi stiker
            if (!foundSticker) {
                setSelectedSticker(null);
                drawCanvas();
            }
        }

        function handlePointerMove(e) {
            if (!draggingSticker) return;
            e.preventDefault(); // Mencegah scrolling browser
            const { x, y } = getCanvasCoordinates(e);
            draggingSticker.x = x - dragOffsetX;
            draggingSticker.y = y - dragOffsetY;
            drawCanvas();
        }

        function handlePointerUp(e) {
            if (draggingSticker) {
                draggingSticker = null;
                drawCanvas();
            }
        }

        // Menambahkan listener untuk Mouse
        canvas.addEventListener('mousedown', handlePointerDown);
        window.addEventListener('mousemove', handlePointerMove); // Menggunakan window agar tidak putus saat gerak cepat
        window.addEventListener('mouseup', handlePointerUp);

        // Menambahkan listener untuk Touch (Jari di HP)
        canvas.addEventListener('touchstart', handlePointerDown, { passive: false });
        window.addEventListener('touchmove', handlePointerMove, { passive: false });
        window.addEventListener('touchend', handlePointerUp);
        
        // --- AKHIR FUNGSI STICKER ---


        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            const lines = text.split('\n');
            let currentY = y;

            for (let i = 0; i < lines.length; i++) {
                let words = lines[i].split(' ');
                let line = '';

                for(let n = 0; n < words.length; n++) {
                    let testLine = line + words[n] + ' ';
                    let metrics = context.measureText(testLine);
                    let testWidth = metrics.width;
                    
                    if (testWidth > maxWidth && n > 0) {
                        context.strokeText(line, x, currentY);
                        context.fillText(line, x, currentY);
                        line = words[n] + ' ';
                        currentY += lineHeight;
                    } else {
                        line = testLine;
                    }
                }
                context.strokeText(line, x, currentY);
                context.fillText(line, x, currentY);
                currentY += lineHeight;
            }
        }

        function drawCanvas() {
            const preset = presets[currentRatio];
            canvas.width = preset.width;
            canvas.height = preset.height;

            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Background
            const bgImage = currentRatio === '16:9' ? bg16x9 : bg1x1;
            if (bgImage.complete && bgImage.naturalWidth !== 0) {
                 ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = '#f3e8ff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // 2. Draw Uploaded Photo
            if (uploadedPhoto) {
                const maxW = preset.width * 0.75;
                const maxH = preset.height * 0.55;
                const baseScale = Math.min(maxW / uploadedPhoto.width, maxH / uploadedPhoto.height);
                
                const userScale = parseInt(imgScaleInput.value) / 100;
                const targetW = uploadedPhoto.width * baseScale * userScale;
                const targetH = uploadedPhoto.height * baseScale * userScale;
                
                const dx = parseInt(imgXInput.value);
                const dy = parseInt(imgYInput.value);
                
                ctx.save();
                ctx.shadowColor = 'rgba(0,0,0,0.2)';
                ctx.shadowBlur = 15;
                ctx.shadowOffsetX = 5;
                ctx.shadowOffsetY = 5;
                const radius = 20;
                ctx.beginPath();
                ctx.moveTo(dx + radius, dy);
                ctx.lineTo(dx + targetW - radius, dy);
                ctx.quadraticCurveTo(dx + targetW, dy, dx + targetW, dy + radius);
                ctx.lineTo(dx + targetW, dy + targetH - radius);
                ctx.quadraticCurveTo(dx + targetW, dy + targetH, dx + targetW - radius, dy + targetH);
                ctx.lineTo(dx + radius, dy + targetH);
                ctx.quadraticCurveTo(dx, dy + targetH, dx, dy + targetH - radius);
                ctx.lineTo(dx, dy + radius);
                ctx.quadraticCurveTo(dx, dy, dx + radius, dy);
                ctx.closePath();
                ctx.fill(); 
                ctx.clip(); 
                
                ctx.drawImage(uploadedPhoto, dx, dy, targetW, targetH);
                ctx.restore();
            }

            // 3. Draw Stickers
            stickers.forEach(s => {
                const currentScale = s.scale || 1;
                const scaledWidth = s.width * currentScale;
                const scaledHeight = s.height * currentScale;

                if (s.type === 'image' && s.img.complete) {
                    ctx.drawImage(s.img, s.x, s.y, scaledWidth, scaledHeight);
                } else if (s.type === 'text') {
                    ctx.font = `${s.fontSize * currentScale}px Arial`;
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'top';
                    ctx.fillStyle = 'white';
                    ctx.fillText(s.content, s.x, s.y);
                }
                
                // Indikator visual kotak tipis kalau stiker lagi dipilih/disentuh
                if (s === selectedSticker) {
                    ctx.strokeStyle = 'rgba(168, 85, 247, 0.9)'; // ungu transparant
                    ctx.lineWidth = 3;
                    ctx.setLineDash([10, 10]);
                    ctx.strokeRect(s.x - 5, s.y - 5, scaledWidth + 10, scaledHeight + 10);
                    ctx.setLineDash([]);
                }
            });

            // 4. Draw Text
            const text = titleInput.value.toUpperCase();
            const fontSize = parseInt(textSizeInput.value);
            const textX = parseInt(textXInput.value);
            const textY = parseInt(textYInput.value);
            
            const maxWidth = preset.textMaxWidth;
            
            ctx.font = `900 ${fontSize}px 'Fredoka', sans-serif`;
            ctx.textAlign = 'center'; 
            ctx.textBaseline = 'top';

            ctx.fillStyle = 'white';
            ctx.strokeStyle = '#4c1d95'; 
            ctx.lineWidth = fontSize * 0.15; 
            ctx.lineJoin = 'round'; 

            wrapText(ctx, text, textX, textY, maxWidth, fontSize * 1.2);
        }

        function downloadThumbnail() {
            // Bersihkan indikator garis putus-putus seleksi sebelum didownload
            const tempSelected = selectedSticker;
            setSelectedSticker(null);
            drawCanvas();
            
            const link = document.createElement('a');
            const suffix = currentRatio === '16:9' ? 'YouTube' : 'Website';
            link.download = `Thumbnail_${suffix}.jpg`;
            link.href = canvas.toDataURL('image/jpeg', 0.9);
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            // Kembalikan seleksi
            setSelectedSticker(tempSelected);
            drawCanvas();
        }

        // Initialize
        document.fonts.ready.then(function () {
            handleRatioChange(); 
        });
        setTimeout(drawCanvas, 500);

    </script>
</body>
</html>
